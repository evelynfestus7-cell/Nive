<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <meta name="description" content="Nive - A premium reading experience." />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/logos/logo-dark-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/logos/logo-dark-512.png" />
  <link rel="apple-touch-icon" href="assets/logos/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <title>Nive Home</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/home.css" />
</head>
<body data-nav-active="home">

<header class="app-header">
  <div class="brand">
    <img loading="lazy" src="assets/logos/logo.png" alt="Nive" class="logo">
  </div>
  <div class="header-right">
    <div id="coinCount" class="coin-badge">🪙</div>
    <button id="profileBtn" class="profile-btn" aria-label="Open profile"></button>
  </div>
</header>

<main class="home-main">
  <section class="hero" id="hero">
    <div class="hero-inner">
      <div class="hero-tag" id="heroTag">FEATURED</div>
      <h2 class="hero-title" id="heroTitle">Loading...</h2>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-actions">
        <button id="heroReadBtn" class="btn">Start Reading</button>
        <button id="heroDetailsBtn" class="btn ghost">Details</button>
      </div>
    </div>
    <div class="hero-art" id="heroArt"></div>
  </section>

  <section class="section">
    <div class="section-title">Featured Stories</div>
    <div class="book-row" id="featuredStoriesContainer" aria-live="polite"></div>
  </section>

  <section class="section">
    <div class="section-title">Trending</div>
    <div class="book-row" id="trendingContainer" aria-live="polite"></div>
  </section>

  <section class="section">
    <div class="section-title">Continue Reading</div>
    <div class="book-row" id="continueReadingContainer"></div>
  </section>
</main>

<div id="nav-container"></div>


<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/user.js"></script>
<script src="js/database.js"></script>
<script src="js/offline.js"></script>
<script src="js/navigation.js"></script>
<script src="js/home.js"></script>
</body>
</html>
