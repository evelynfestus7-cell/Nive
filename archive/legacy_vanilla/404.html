<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Page not found - Nive interactive stories." />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/logos/logo-dark-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/logos/logo-dark-512.png" />
  <link rel="apple-touch-icon" href="assets/logos/apple-touch-icon.png" />
  <title>404 - Page Not Found | Nive</title>
  <link rel="stylesheet" href="css/global.css" />
  <style>
    .error-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .error-code {
      font-size: clamp(5rem, 15vw, 8rem);
      font-weight: 900;
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-card {
      max-width: 480px;
      width: 100%;
      background: rgba(18, 18, 24, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.75rem;
    }
    .error-desc {
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .error-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
  </style>
  <script src="js/user.js"></script>
</head>
<body data-nav-active="none">
  <main class="error-container">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Story or Page Not Found</h1>
      <p class="error-desc">The chapter, page, or dimension you are looking for doesn't exist or has been moved to another timeline.</p>
      <div class="error-actions">
        <a href="home.html" class="btn">Return to Home</a>
        <a href="library.html" class="btn ghost">Browse Library</a>
      </div>
    </div>
  </main>

  <div id="nav-container"></div>
  <script src="js/navigation.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
