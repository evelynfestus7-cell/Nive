<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <meta name="description" content="Nive - A premium reading experience." />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/logos/logo-dark-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/logos/logo-dark-512.png" />
  <link rel="apple-touch-icon" href="assets/logos/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <title>Nive Library</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/library.css" />
  <link rel="stylesheet" href="css/library-ui.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />
</head>

<body data-nav-active="library">
  <div id="nav-container" aria-hidden="false"></div>

  <header class="library-header container">
    <div class="library-top">
      <div>
        <h1>Library</h1>
        <div id="librarySummary" class="library-summary">Loading stories...</div>
      </div>

      <div class="search-wrap">
        <span class="material-symbols-rounded" aria-hidden="true">search</span>
        <input id="searchInput" class="search" type="search" placeholder="Search your library and all stories..."
          aria-label="Search stories">
        <button id="clearSearch" class="icon-btn" type="button" title="Clear search" aria-label="Clear search">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
    </div>

    <div class="filters">
      <div class="categories" id="genreList" role="tablist" aria-label="Genres"></div>
      <div class="sort">
        <label for="sortSelect" class="sr-only">Sort</label>
        <select id="sortSelect" aria-label="Sort stories">
          <option value="featured">Featured</option>
          <option value="rating">Top Rated</option>
          <option value="recent">Newest</option>
          <option value="alpha">A to Z</option>
          <option value="progress">Continue Reading</option>
        </select>
      </div>
    </div>
  </header>

  <main class="content-area container">
    <div id="featuredContainer"></div>

    <section class="section">
      <div class="section-title">Browse Stories</div>
      <div id="libraryGrid" class="grid" aria-live="polite"></div>
      <div id="libraryEmpty" class="empty-note muted" hidden>No stories match your filters.</div>
    </section>

    <section class="section">
      <div class="section-title">My Library</div>
      <div id="savedGrid" class="grid"></div>
      <div id="savedEmpty" class="empty-note muted" hidden>Add stories to your library to see them here.</div>
    </section>

    <section class="section">
      <div class="section-title">Favorites</div>
      <div id="favoritesGrid" class="grid"></div>
      <div id="favoritesEmpty" class="empty-note muted" hidden>No favorites yet.</div>
    </section>

    <section class="section">
      <div class="section-title">Reading Lists</div>
      <div id="libraryReadingListsGrid" class="reading-lists-grid"></div>
    </section>

    <section class="section">
      <div class="section-title">Bookmarks</div>
      <div id="bookmarksGrid" class="bookmark-list"></div>
      <div id="bookmarksEmpty" class="empty-note muted" hidden>No bookmarks yet.</div>
    </section>

    <section class="section">
      <div class="section-title">Downloads</div>
      <div id="downloadsGrid" class="grid"></div>
      <div id="downloadsEmpty" class="empty-note muted" hidden>No downloads yet.</div>
    </section>
  </main>


  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/user.js"></script>
  <script src="js/database.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/stories.js"></script>
  <script src="js/social.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/library-page.js"></script>
</body>

</html>
