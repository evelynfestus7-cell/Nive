<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Nive admin sign in.">
  <meta name="theme-color" content="#050505">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/logos/logo-dark-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/logos/logo-dark-512.png" />
  <link rel="apple-touch-icon" href="assets/logos/apple-touch-icon.png" />
  <title>Nive Admin Login</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    body {
      background:#0d0d0d;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }
    .login-box {
      background:#181818;
      padding:30px;
      border-radius:16px;
      width:min(360px, 100%);
      box-shadow:0 0 20px rgba(0,0,0,0.6);
    }
    h1 {
      margin-bottom:20px;
      text-align:center;
      font-size:26px;
    }
    label {
      display:block;
      margin:12px 0 8px;
      color:var(--muted);
      font-size:13px;
    }
    input {
      width:100%;
      padding:12px;
      border-radius:8px;
      background:#101010;
      color:white;
      border:1px solid #282828;
      font-size:14px;
    }
    button {
      width:100%;
      margin-top:18px;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#d50000;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }
    button:hover { opacity:0.85; }
  </style>
</head>
<body>
  <form class="login-box" id="adminLoginForm">
    <h1>Admin Login</h1>
    <label for="emailInput">Email</label>
    <input id="emailInput" type="email" placeholder="admin@nive.app" required>
    <label for="passwordInput">Password</label>
    <input id="passwordInput" type="password" placeholder="Password" required>
    <button type="submit" id="loginBtn">Login as Admin</button>
  </form>

  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/user.js?v=email-only-admin-20260903"></script>
  <script src="js/admin-auth.js?v=email-only-admin-20260903"></script>
  <script>
    const form = document.getElementById("adminLoginForm");
    const loginBtn = document.getElementById("loginBtn");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      loginBtn.disabled = true;
      loginBtn.textContent = "Verifying...";

      try {
        await adminSignIn(
          document.getElementById("emailInput").value.trim(),
          document.getElementById("passwordInput").value
        );
        location.href = "admin-dashboard.html";
      } catch (error) {
        showToast(error.message || "Admin login failed.");
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Login as Admin";
      }
    });
  </script>
</body>
</html>
